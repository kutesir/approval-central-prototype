<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval Central — Prototype</title>
<style>
  body { margin: 0; background: #050505; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 0; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; border: none; background: none; color: inherit; cursor: pointer; padding: 0; }
  input { font: inherit; }

  :root {
    --bg: #0a0a0c;
    --surface: #17171a;
    --surface-2: #1f1f23;
    --border: #28282c;
    --text: #f2f2f0;
    --text-dim: #9a9aa0;
    --text-faint: #5c5c62;
    --mtn-yellow: #ffcc00;
    --urgent: #ff6b4a;
    --urgent-bg: rgba(255,107,74,0.14);
    --green: #30d158;
    --red: #ff453a;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px) scale(0.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ac-row-enter { animation: riseIn 260ms var(--ease-out) both; }
  .ac-screen-enter { animation: riseIn 220ms var(--ease-out) both; }
  .ac-pop { animation: popIn 170ms var(--ease-out) both; }
  .ac-spin { animation: spin 0.6s linear infinite; }

  .ac-btn { transition: transform 150ms var(--ease-out), opacity 150ms var(--ease-out); }
  .ac-btn:active { transform: scale(0.97); }
  .ac-row { transition: background 120ms ease; }
  .ac-row:hover { background: var(--surface-2); }

  .ac-skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
    background-size: 400px 100%;
    animation: shimmer 1.3s linear infinite;
    border-radius: 6px;
  }

  #phone { width: 390px; height: 844px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; position: relative; border-radius: 40px; box-shadow: 0 0 0 10px #1a1a1a, 0 20px 60px rgba(0,0,0,0.6); }
  #scroll::-webkit-scrollbar, .ac-scroll::-webkit-scrollbar { display: none; }

  footer { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11px; color: #4a4a4a; }
  footer a { color: #7a7a7a; }
</style>
</head>
<body>

<div id="phone"></div>
<footer>Approval Central — interactive prototype · MTN Access Portal</footer>

<script>
const pendingSeed = [
  { id: 'ritm-004276', urgent: true, type: 'Log system access', ref: 'RITM-004276', requester: 'Joel Kato', requesterShort: 'Joel K.', dept: 'IT Operations', ageLabel: 'Due today', itemized: true, submittedAt: 'today at 07:10', stepLabel: '1 of 3',
    subItems: [
      { key: 'vantage', label: 'Vantage PM', detail: 'Editor access · Permanent' },
      { key: 'eva', label: 'EVA', detail: 'Read-only access · 90 days' },
      { key: 'daas', label: 'DAAS', detail: 'Operator access · 30 days' },
    ] },
  { id: 'ritm-004281', urgent: false, type: 'Server access request', ref: 'RITM-004281', requester: 'Amina Nakato', requesterShort: 'Amina N.', dept: 'Enterprise IT', ageLabel: 'Today', itemized: false, submittedAt: 'today at 08:42',
    fact1Label: 'Environment', fact1Value: 'Production', fact2Label: 'Duration', fact2Value: '90 days',
    detailLabel: 'Access requested', detailValue: 'SSH access to billing application servers for incident support and scheduled maintenance.',
    businessReason: 'Required for Q4 production support rotation.', hasAttachment: false },
  { id: 'ritm-004263', urgent: false, type: 'Vehicle maintenance', ref: 'RITM-004263', requester: 'Sarah Amono', requesterShort: 'Sarah A.', dept: 'Fleet', ageLabel: 'Yesterday', itemized: false, submittedAt: 'yesterday at 14:20',
    fact1Label: 'Vehicle', fact1Value: 'UA 026 AG', fact2Label: 'Mileage', fact2Value: '48,200 km',
    detailLabel: 'Issue reported', detailValue: 'Front brake pads worn, needs replacement before the next trip.',
    businessReason: 'Vehicle flagged unsafe at last inspection.', hasAttachment: true, attachmentName: 'inspection-photo.jpg' },
  { id: 'ritm-004250', urgent: false, type: 'Employee exit', ref: 'RITM-004250', requester: 'Denis Mugisha', requesterShort: 'Denis M.', dept: 'Finance', ageLabel: '2 days ago', itemized: false, submittedAt: '2 days ago',
    fact1Label: 'Last working day', fact1Value: 'Oct 9, 2026', fact2Label: 'Manager', fact2Value: 'Grace N.',
    detailLabel: 'Clearance scope', detailValue: 'Revoke all system access, recover laptop and access card.',
    businessReason: 'Standard offboarding clearance.', hasAttachment: false },
];
const doneSeed = [
  { id: 'done-1', type: 'Vehicle maintenance', ref: 'RITM-004102', decision: 'rejected', timeLabel: 'Yesterday', comment: 'Please attach the inspection report.' },
  { id: 'done-2', type: 'Employee exit', ref: 'RITM-004087', decision: 'approved', timeLabel: '3 days ago', comment: null },
];

const icon = {
  back: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
  chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
  refresh: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>',
  inbox: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>',
  done: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>',
  check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  cross: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
  clip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>',
  info: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
  alert: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--urgent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
  caughtUp: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
  offline: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>',
};

function esc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

class App {
  constructor() {
    this.state = {
      screen: 'login', selectedId: null, selectedDoneId: null,
      pending: pendingSeed, done: doneSeed,
      loading: false, refreshing: false, confirming: null, comment: '',
      itemDecisions: {}, toast: null,
    };
  }

  set(patch) { Object.assign(this.state, patch); this.render(); }

  login() { this.set({ screen: 'inbox', loading: true }); setTimeout(() => this.set({ loading: false }), 800); }
  refresh() { this.set({ refreshing: true }); setTimeout(() => this.set({ refreshing: false }), 600); }
  goPending() { this.set({ screen: 'inbox' }); }
  goDone() { this.set({ screen: 'done' }); }
  openItem(id) { const item = this.state.pending.find(p => p.id === id); if (!item) return; this.set({ screen: item.itemized ? 'itemized' : 'decision', selectedId: id, confirming: null, comment: '', itemDecisions: {} }); }
  backToInbox() { this.set({ screen: 'inbox', confirming: null, comment: '' }); }
  backToDone() { this.set({ screen: 'done' }); }
  openDone(id) { this.set({ screen: 'doneDetail', selectedDoneId: id }); }
  startApprove() { this.set({ confirming: 'approve' }); }
  startReject() { this.set({ confirming: 'reject' }); }
  cancelConfirm() { this.set({ confirming: null }); }
  setComment(v) { this.state.comment = v; }
  setItemDecision(key, decision) { this.set({ itemDecisions: { ...this.state.itemDecisions, [key]: decision } }); }

  commitConfirm() {
    const decision = this.state.confirming === 'approve' ? 'approved' : 'rejected';
    this.finishDecision(decision, this.state.comment);
  }

  submitItemized() {
    const sel = this.state.pending.find(p => p.id === this.state.selectedId);
    if (!sel) return;
    const allDecided = sel.subItems.every(si => this.state.itemDecisions[si.key]);
    if (!allDecided) return;
    const anyRejected = sel.subItems.some(si => this.state.itemDecisions[si.key] === 'rejected');
    this.finishDecision(anyRejected ? 'partially_approved' : 'approved', this.state.comment);
  }

  finishDecision(decision, comment) {
    const sel = this.state.pending.find(p => p.id === this.state.selectedId);
    if (!sel) return;
    const doneEntry = { id: 'done-' + Date.now(), type: sel.type, ref: sel.ref, decision, timeLabel: 'Just now', comment: comment && comment.trim() ? comment.trim() : null };
    const remaining = this.state.pending.filter(p => p.id !== sel.id);
    const label = decision === 'rejected' ? 'Rejected' : (decision === 'partially_approved' ? 'Submitted' : 'Approved');
    this.set({ pending: remaining, done: [doneEntry, ...this.state.done], confirming: null, comment: '', itemDecisions: {}, toast: label + ' · ' + sel.ref });
    setTimeout(() => {
      const next = remaining[0];
      if (next) this.set({ screen: next.itemized ? 'itemized' : 'decision', selectedId: next.id, toast: null });
      else this.set({ screen: 'inbox', toast: null });
    }, 900);
  }

  render() {
    const root = document.getElementById('phone');
    const active = document.activeElement;
    const activeId = active && active.id;
    const selStart = active && active.selectionStart != null ? active.selectionStart : null;
    const selEnd = active && active.selectionEnd != null ? active.selectionEnd : null;

    root.innerHTML = this.template();

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) { el.focus(); if (selStart != null) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} } }
    }
  }

  template() {
    const s = this.state;
    const screen = s.screen;

    if (screen === 'login') return this.loginScreen();
    if (screen === 'inbox' || screen === 'done') return this.tabScreen();
    if (screen === 'decision') return this.decisionScreen();
    if (screen === 'itemized') return this.itemizedScreen();
    if (screen === 'doneDetail') return this.doneDetailScreen();
    return '';
  }

  loginScreen() {
    return `
    <div class="ac-screen-enter" style="flex:1;display:flex;flex-direction:column;padding:64px 28px 40px;align-items:flex-start;">
      <div style="width:64px;height:64px;border-radius:32px;background:var(--mtn-yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#141414;">MTN</div>
      <div style="margin-top:40px;">
        <div style="font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--text-dim);text-transform:uppercase;">Approval Central</div>
        <div style="font-size:30px;font-weight:700;margin-top:8px;line-height:1.2;">Decide what needs you.</div>
        <div style="font-size:14px;color:var(--text-dim);margin-top:10px;line-height:1.5;max-width:300px;">Review and act on your MTN approvals in one place.</div>
      </div>
      <div style="flex:1;"></div>
      <button class="ac-btn" onclick="app.login()" style="width:100%;height:52px;background:#fff;color:#0a0a0c;border-radius:14px;font-size:15px;font-weight:700;">Continue with MTN SSO</button>
      <div style="font-size:12px;color:var(--text-faint);margin-top:12px;text-align:center;width:100%;line-height:1.5;">You will sign in through MTN's secure identity service.</div>
    </div>`;
  }

  tabScreen() {
    const s = this.state;
    const isPending = s.screen === 'inbox';
    const sortedPending = [...s.pending].sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0));

    let body = '';
    if (isPending) {
      if (s.loading) {
        body = `<div style="padding:16px 20px;">${[0,1,2,3].map(() => `
          <div style="padding:14px 0;border-bottom:1px solid var(--border);">
            <div class="ac-skeleton" style="width:62%;height:14px;margin-bottom:8px;"></div>
            <div class="ac-skeleton" style="width:40%;height:11px;"></div>
          </div>`).join('')}</div>`;
      } else if (sortedPending.length === 0) {
        body = `<div class="ac-pop" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 40px 0;text-align:center;">
          ${icon.caughtUp}
          <div style="font-size:15px;font-weight:600;margin-top:16px;">You are all caught up.</div>
          <div style="font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.5;">New approvals will appear here.</div>
        </div>`;
      } else {
        body = `
        <div style="padding:4px 20px 2px;display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
          <div style="font-size:16px;font-weight:700;">Needs your decision</div>
          <div style="font-size:12px;font-weight:700;color:var(--urgent);background:var(--urgent-bg);padding:4px 10px;border-radius:20px;">${sortedPending.length} pending</div>
        </div>
        <div style="padding:10px 20px 24px;">
          ${sortedPending.map((item, i) => `
          <a href="javascript:void(0)" onclick="app.openItem('${item.id}')" class="ac-row ac-row-enter" style="animation-delay:${i*45}ms;display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);">
            <div style="min-width:0;">
              <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.type)}</div>
              <div style="font-size:12.5px;color:var(--text-dim);margin-top:3px;">${esc(item.ref)} · ${esc(item.requesterShort)} · <span style="${item.urgent?'color:var(--urgent);font-weight:600':''}">${esc(item.ageLabel)}</span></div>
            </div>
            ${icon.chevron}
          </a>`).join('')}
        </div>`;
      }
    } else {
      body = `
      <div style="padding-top:10px;">
        <div style="padding:0 20px 6px;font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.4px;">Your recent decisions</div>
        ${s.done.map((item, i) => {
          const approved = item.decision === 'approved';
          const label = approved ? 'Approved' : (item.decision === 'partially_approved' ? 'Submitted' : 'Rejected');
          return `
          <a href="javascript:void(0)" onclick="app.openDone('${item.id}')" class="ac-row ac-row-enter" style="animation-delay:${i*45}ms;display:flex;align-items:flex-start;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);">
            <div style="width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;background:${approved?'rgba(48,209,88,0.14)':'rgba(255,69,58,0.14)'};">${approved?icon.check:icon.cross}</div>
            <div style="min-width:0;flex:1;">
              <div style="font-size:15px;font-weight:600;">${esc(item.type)}</div>
              <div style="font-size:12.5px;color:var(--text-dim);margin-top:3px;">${label} · ${esc(item.ref)} · ${esc(item.timeLabel)}</div>
              ${item.comment ? `<div style="font-size:12.5px;color:var(--text-dim);margin-top:4px;font-style:italic;">"${esc(item.comment)}"</div>` : ''}
            </div>
          </a>`;
        }).join('')}
      </div>`;
    }

    return `
    <div class="ac-screen-enter" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div style="padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:26px;height:26px;border-radius:13px;background:var(--mtn-yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;color:#141414;">MTN</div>
          <div style="font-size:19px;font-weight:700;">${isPending ? 'Approvals' : 'Done'}</div>
        </div>
        ${isPending ? `<button class="ac-btn" onclick="app.refresh()" aria-label="Refresh" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);">
          <span class="${s.refreshing?'ac-spin':''}" style="display:inline-flex;">${icon.refresh}</span>
        </button>` : ''}
      </div>
      <div class="ac-scroll" style="flex:1;overflow-y:auto;min-height:0;">${body}</div>
      <div style="display:flex;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:6px;">
        <button class="ac-btn" onclick="app.goPending()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;color:${isPending?'var(--text)':'var(--text-faint)'};">${icon.inbox}<div style="font-size:10px;font-weight:600;">Pending</div></button>
        <button class="ac-btn" onclick="app.goDone()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;color:${!isPending?'var(--text)':'var(--text-faint)'};">${icon.done}<div style="font-size:10px;font-weight:600;">Done</div></button>
      </div>
    </div>
    ${this.toastHtml()}`;
  }

  decisionScreen() {
    const s = this.state;
    const sel = s.pending.find(p => p.id === s.selectedId) || s.pending[0] || {};
    const confirming = s.confirming;

    return `
    <div class="ac-screen-enter" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div style="padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <button class="ac-btn" onclick="app.backToInbox()" aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${icon.back}</button>
        <div style="font-size:17px;font-weight:700;">Review request</div>
      </div>
      <div class="ac-scroll" style="flex:1;overflow-y:auto;padding:20px;min-height:0;">
        <div style="font-size:12px;font-weight:700;color:var(--text-dim);letter-spacing:0.4px;">${esc(sel.ref)}</div>
        <div style="font-size:21px;font-weight:700;margin-top:4px;">${esc(sel.type)}</div>
        <div style="font-size:12.5px;color:var(--text-faint);margin-top:4px;">Submitted ${esc(sel.submittedAt)}</div>
        <div style="height:1px;background:var(--border);margin:18px 0;"></div>
        <div style="display:flex;gap:20px;">
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">Requested by</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">${esc(sel.requester)}</div></div>
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">Department</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">${esc(sel.dept)}</div></div>
        </div>
        <div style="display:flex;gap:20px;margin-top:16px;">
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">${esc(sel.fact1Label)}</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">${esc(sel.fact1Value)}</div></div>
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">${esc(sel.fact2Label)}</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">${esc(sel.fact2Value)}</div></div>
        </div>
        <div style="height:1px;background:var(--border);margin:18px 0;"></div>
        <div style="font-size:14px;font-weight:700;">${esc(sel.detailLabel)}</div>
        <div style="font-size:13.5px;color:var(--text-dim);margin-top:6px;line-height:1.55;">${esc(sel.detailValue)}</div>
        <div style="font-size:14px;font-weight:700;margin-top:18px;">Business reason</div>
        <div style="font-size:13.5px;color:var(--text-dim);margin-top:6px;line-height:1.55;">${esc(sel.businessReason)}</div>
        ${sel.hasAttachment ? `<div style="display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 12px;background:var(--surface);border-radius:10px;">${icon.clip}<div style="font-size:12.5px;color:var(--text-dim);">${esc(sel.attachmentName)}</div></div>` : ''}

        <div style="margin-top:20px;">
          <input id="commentInput" value="${esc(s.comment)}" oninput="app.setComment(this.value)" placeholder="${confirming==='reject' ? 'Reason for rejection (helps the requester)' : 'Add a comment (optional)'}" style="width:100%;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 14px;color:var(--text);font-size:13.5px;" />
        </div>

        ${confirming ? `
        <div class="ac-pop" style="margin-top:18px;padding:16px;background:var(--surface);border-radius:14px;border:1px solid var(--border);">
          <div style="font-size:14px;font-weight:600;">${confirming==='approve'?'Approve this request?':'Reject this request?'}</div>
          <div style="display:flex;gap:10px;margin-top:14px;">
            <button class="ac-btn" onclick="app.cancelConfirm()" style="flex:1;height:44px;background:var(--surface-2);border-radius:10px;font-size:14px;font-weight:600;">Cancel</button>
            <button class="ac-btn" onclick="app.commitConfirm()" style="flex:1;height:44px;background:${confirming==='approve'?'#ffffff':'var(--red)'};color:${confirming==='approve'?'#0a0a0c':'#ffffff'};border-radius:10px;font-size:14px;font-weight:700;">${confirming==='approve'?'Yes, approve':'Yes, reject'}</button>
          </div>
        </div>` : `
        <div style="display:flex;gap:10px;margin-top:18px;">
          <button class="ac-btn" onclick="app.startReject()" style="flex:1;height:48px;background:var(--surface-2);border-radius:12px;font-size:14.5px;font-weight:600;">Reject</button>
          <button class="ac-btn" onclick="app.startApprove()" style="flex:1.3;height:48px;background:#ffffff;color:#0a0a0c;border-radius:12px;font-size:14.5px;font-weight:700;">Approve request</button>
        </div>`}
      </div>
    </div>
    ${this.toastHtml()}`;
  }

  itemizedScreen() {
    const s = this.state;
    const sel = s.pending.find(p => p.id === s.selectedId) || s.pending[0] || {};
    const subItems = sel.subItems || [];
    const decided = subItems.filter(si => s.itemDecisions[si.key]).length;
    const total = subItems.length;
    const disabled = decided < total;

    return `
    <div class="ac-screen-enter" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div style="padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <button class="ac-btn" onclick="app.backToInbox()" aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${icon.back}</button>
        <div style="font-size:17px;font-weight:700;">Choose per item</div>
      </div>
      <div class="ac-scroll" style="flex:1;overflow-y:auto;padding:20px;min-height:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:12px;font-weight:700;color:var(--text-dim);letter-spacing:0.4px;">${esc(sel.ref)}</div>
          <div style="font-size:11.5px;font-weight:700;color:var(--urgent);background:var(--urgent-bg);padding:3px 9px;border-radius:16px;">${esc(sel.stepLabel)}</div>
        </div>
        <div style="font-size:21px;font-weight:700;margin-top:4px;margin-bottom:18px;">${esc(sel.type)}</div>

        ${subItems.map(si => {
          const picked = s.itemDecisions[si.key];
          const approveBg = picked === 'approved' ? '#ffffff' : 'var(--surface-2)';
          const approveColor = picked === 'approved' ? '#0a0a0c' : 'var(--text)';
          const rejectBg = picked === 'rejected' ? 'var(--red)' : 'var(--surface-2)';
          const rejectColor = picked === 'rejected' ? '#ffffff' : 'var(--text)';
          return `
          <div style="padding:16px 0;border-top:1px solid var(--border);">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div style="font-size:15px;font-weight:600;">${esc(si.label)}</div>${icon.info}
            </div>
            <div style="font-size:12.5px;color:var(--text-dim);margin-top:2px;">${esc(si.detail)}</div>
            <div style="display:flex;gap:10px;margin-top:10px;">
              <button class="ac-btn" onclick="app.setItemDecision('${si.key}','rejected')" style="flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:600;background:${rejectBg};color:${rejectColor};">Reject</button>
              <button class="ac-btn" onclick="app.setItemDecision('${si.key}','approved')" style="flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:600;background:${approveBg};color:${approveColor};">Approve</button>
            </div>
          </div>`;
        }).join('')}

        <div style="margin-top:18px;">
          <input id="commentInput" value="${esc(s.comment)}" oninput="app.setComment(this.value)" placeholder="Add an overall comment (optional)" style="width:100%;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 14px;color:var(--text);font-size:13.5px;" />
        </div>

        <button class="ac-btn" onclick="app.submitItemized()" ${disabled?'disabled':''} style="width:100%;height:50px;margin-top:16px;border-radius:12px;font-size:14.5px;font-weight:700;background:${disabled?'var(--surface-2)':'#ffffff'};color:${disabled?'var(--text-faint)':'#0a0a0c'};opacity:${disabled?'0.6':'1'};">Submit ${decided} of ${total} decisions</button>
      </div>
    </div>
    ${this.toastHtml()}`;
  }

  doneDetailScreen() {
    const s = this.state;
    const d = s.done.find(x => x.id === s.selectedDoneId) || s.done[0] || {};
    const approved = d.decision === 'approved';
    const label = approved ? 'Approved' : (d.decision === 'partially_approved' ? 'Submitted' : 'Rejected');
    const color = approved ? 'var(--green)' : 'var(--red)';
    const bg = approved ? 'rgba(48,209,88,0.14)' : 'rgba(255,69,58,0.14)';

    return `
    <div class="ac-screen-enter" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div style="padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <button class="ac-btn" onclick="app.backToDone()" aria-label="Back" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${icon.back}</button>
        <div style="font-size:17px;font-weight:700;">Decision</div>
      </div>
      <div class="ac-scroll" style="flex:1;overflow-y:auto;padding:20px;min-height:0;">
        <div style="font-size:12px;font-weight:700;color:var(--text-dim);letter-spacing:0.4px;">${esc(d.ref)}</div>
        <div style="font-size:21px;font-weight:700;margin-top:4px;">${esc(d.type)}</div>
        <div style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:7px 12px;border-radius:20px;background:${bg};">
          <div style="width:7px;height:7px;border-radius:4px;background:${color};"></div>
          <div style="font-size:12.5px;font-weight:700;color:${color};">${label}</div>
        </div>
        <div style="height:1px;background:var(--border);margin:18px 0;"></div>
        <div style="display:flex;gap:20px;">
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">Decided</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">${esc(d.timeLabel)}</div></div>
          <div style="flex:1;"><div style="font-size:11.5px;color:var(--text-dim);">By</div><div style="font-size:14.5px;font-weight:600;margin-top:3px;">You</div></div>
        </div>
        ${d.comment ? `<div style="margin-top:18px;"><div style="font-size:14px;font-weight:700;">Comment</div><div style="font-size:13.5px;color:var(--text-dim);margin-top:6px;line-height:1.55;">${esc(d.comment)}</div></div>` : ''}
        <div style="margin-top:22px;font-size:12px;color:var(--text-faint);line-height:1.5;">This is a read-only summary. Full audit history lives in the web portal.</div>
      </div>
    </div>`;
  }

  toastHtml() {
    const t = this.state.toast;
    if (!t) return '';
    const rejected = t.indexOf('Rejected') === 0;
    return `
    <div style="position:absolute;top:14px;left:50%;animation:toastIn 220ms var(--ease-out) both;display:flex;align-items:center;gap:8px;background:#1c1c1e;border:1px solid var(--border);padding:10px 16px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,0.4);white-space:nowrap;">
      <div style="width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${rejected?'rgba(255,69,58,0.18)':'rgba(48,209,88,0.18)'};">${rejected?icon.cross:icon.check}</div>
      <div style="font-size:13px;font-weight:600;">${esc(t)}</div>
    </div>`;
  }
}

const app = new App();
app.render();
</script>
</body>
</html>
